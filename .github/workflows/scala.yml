name: Scala CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [17, 25]
    env:
      JAVA_OPTS: -Xmx2048M

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK
      uses: actions/setup-java@v6
      with:
        distribution: "temurin"
        java-version: ${{ matrix.java }}
    - name: Setup SBT
      uses: sbt/setup-sbt@v1
    - name: Run tests
      run: sbt
           -v
           --server
           scalafmtSbtCheck
           "+ scalafmtCheckAll"
           scripted
